<!doctype html>
<html lang="vi" data-mode="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TestFlow theme preview</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body { font: 16px sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
    main { max-width: 700px; margin: auto; }
    .paper { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; margin-top: 2rem; }
    label { display: inline-grid; gap: .4rem; margin-right: 1rem; }
    select, button { padding: .6rem; font: inherit; }
    button { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; }
    .muted { color: var(--muted); }
    .line { border-top: 1px solid var(--border); padding-top: 1rem; }
  </style>
  <script>
    const preference = localStorage.getItem('tf_mode');
    document.documentElement.dataset.mode = preference === 'light' || preference === 'dark'
      ? preference : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
</head>
<body>
  <main>
    <h1>TestFlow / chế độ hiển thị</h1>
    <label>Chế độ <select id="mode">
      <option value="light">Sáng</option><option value="dark">Tối</option>
    </select></label>
    <div class="paper"><p class="muted">ĐỀ LUYỆN TẬP / 40 CÂU</p>
      <h2>Đọc rõ trong cả hai chế độ</h2>
      <p class="line">Đây là bản xem trước của tờ đề, viền và chữ phụ.</p>
      <button>Tiếp tục</button>
    </div>
  </main>
  <script>
    const modeSelect = document.getElementById('mode');
    modeSelect.value = document.documentElement.dataset.mode;
    const apply = () => {
      document.documentElement.dataset.mode = modeSelect.value;
      localStorage.setItem('tf_mode', modeSelect.value);
    };
    modeSelect.addEventListener('change', apply);
  </script>
</body>
</html>
