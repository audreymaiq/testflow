services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: testflow
      POSTGRES_USER: testflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testflow -d testflow"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: testflow-api:${BUILD_SHA:?Set BUILD_SHA to the release revision}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      HOME: /tmp
    command: ["sh", "-c", "python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 60 --graceful-timeout 30 --access-logfile -"]
    volumes:
      - media_data:/app/media/private
      - static_data:/app/staticfiles
    tmpfs: [/tmp]
    read_only: true
    networks: [edge, data]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4

  worker:
    image: testflow-worker:${BUILD_SHA:?Set BUILD_SHA to the release revision}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      HOME: /tmp
    volumes:
      - media_data:/app/media/private
    tmpfs: [/tmp]
    read_only: true
    networks: [data, extractor_egress]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    init: true
    stop_grace_period: 90s

  recovery:
    image: testflow-api:${BUILD_SHA:?Set BUILD_SHA to the release revision}
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      HOME: /tmp
    command: ["sh", "-c", "while :; do python manage.py recover_import_jobs; sleep 300; done"]
    tmpfs: [/tmp]
    read_only: true
    networks: [data]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    init: true

  web:
    image: testflow-web:${BUILD_SHA:?Set BUILD_SHA to the release revision}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to an authorized DNS name}
    ports: ["80:80", "443:443"]
    volumes:
      - static_data:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    init: true

networks:
  edge:
  data:
    internal: true
  extractor_egress:

volumes:
  pg_data:
  redis_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
