<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="referrer" content="no-referrer" />
    <title>TestFlow</title>
    <script>
      (() => {
        const root = document.documentElement;
        const theme = localStorage.getItem('tf_theme') || 'ocean';
        const preference = localStorage.getItem('tf_mode') || 'system';
        root.dataset.theme = ['ocean', 'amber', 'sakura', 'holo'].includes(theme) ? theme : 'ocean';
        root.dataset.mode = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
